[package]
name = "sync-ssh"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
syncssh-core = { path = "../syncssh-core" }
syncssh-session = { path = "../syncssh-session" }
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
gpui-terminal = "=0.1.0"
anyhow = "1"
directories = "6"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
flume = "0.11"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
font-kit = { package = "zed-font-kit", version = "=0.14.1-zed" }

[target.'cfg(target_os = "windows")'.build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_Input_Ime", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
ttf-parser = "=0.25.1"

[[bin]]
name = "sync-ssh"
path = "src/main.rs"

# GPUI's native text system must be constructed on the process main thread.
[[test]]
name = "native_font_fallbacks"
harness = false
