[package]
name = "syncssh-session"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
flume = "0.11"
portable-pty = "0.9"
russh = { version = "0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
same-file = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "fs"] }
zeroize = { version = "1", features = ["derive"] }
zmodem2 = "=0.7.3"

[dev-dependencies]
base64 = "0.22"
sha2 = "0.10"
rand = "0.10"
